# ParkEase — Jenkins + SonarQube Docker Compose
# Start with: docker compose -f docker-compose-jenkins.yml up -d
# Jenkins UI:    http://localhost:8080
# SonarQube UI:  http://localhost:9000 (admin/admin)

services:

  # ── Jenkins CI/CD Server ──
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: parkease-jenkins
    ports:
      - "9090:8080"       # Jenkins Web UI (mapped to 9090 to avoid port conflict)
      - "50000:50000"     # Jenkins agent connections
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    restart: unless-stopped

  # ── SonarQube Code Quality ──
  sonarqube:
    image: sonarqube:lts-community
    container_name: parkease-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
