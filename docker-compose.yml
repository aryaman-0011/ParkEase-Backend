# ParkEase — Jenkins + SonarQube + Redis Docker Compose
# Start with: docker compose up -d
# Jenkins UI:    http://localhost:9090 (admin)
# SonarQube UI:  http://localhost:9000 (admin/admin)
# Redis:         localhost:6379

services:

  # ── Jenkins CI/CD Server ──
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: parkease-jenkins
    ports:
      - "9090:8080"       # Jenkins Web UI (mapped to 9090 to avoid port conflict)
      - "50000:50000"     # Jenkins agent connections
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true
    networks:
      - parkease-ci
    restart: unless-stopped

  # ── SonarQube Code Quality ──
  sonarqube:
    image: sonarqube:lts-community
    container_name: parkease-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks:
      - parkease-ci

  # ── Redis (used by auth-service OTP, booking-service distributed locks) ──
  redis:
    image: redis:7-alpine
    container_name: parkease-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - parkease-ci

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  redis_data:

networks:
  parkease-ci:
    driver: bridge
